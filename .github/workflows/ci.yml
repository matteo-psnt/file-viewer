name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Validate and test the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Pinned: the function-hooks API is early access and changes between releases.
      - run: npm install -g @anthropic-ai/claude-code@2.1.295
      - run: claude plugin validate .
      - run: claude plugin validate plugin
      - run: claude plugin test plugin

  overlay:
    name: iTerm2 overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m unittest discover -s plugin/tests -p 'test_*.py'

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck -s sh plugin/scripts/*.sh plugin/tests/converter.sh demo/record.sh .githooks/commit-msg

  converter-linux:
    name: Converter on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            poppler-utils librsvg2-bin imagemagick libheif1 libheif-plugin-libde265 unzip \
            libreoffice-writer libreoffice-math
      - run: sh plugin/tests/converter.sh

  converter-macos:
    name: Converter on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: brew install poppler librsvg imagemagick
      - run: sh plugin/tests/converter.sh

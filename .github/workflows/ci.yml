name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Validate and test the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: the function-hooks API is early access and changes between releases.
      - run: npm install -g @anthropic-ai/claude-code@2.1.295
      - run: claude plugin validate .
      - run: claude plugin test .

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh scripts/*.sh tests/converter.sh demo/record.sh .githooks/commit-msg

  converter-linux:
    name: Converter on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            poppler-utils librsvg2-bin imagemagick libheif1 libheif-plugin-libde265 unzip \
            libreoffice-writer libreoffice-math
      - run: sh tests/converter.sh

  converter-macos:
    name: Converter on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install poppler librsvg imagemagick
      - run: sh tests/converter.sh

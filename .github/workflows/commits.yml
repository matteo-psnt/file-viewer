name: Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A squash merge makes the PR title the commit on main, which
      # release-please reads, so the title is checked along with each commit.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          msg=$(mktemp)
          status=0
          printf '%s\n' "$TITLE" > "$msg"
          sh .githooks/commit-msg "$msg" || status=1
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$msg"
            sh .githooks/commit-msg "$msg" || status=1
          done
          exit $status

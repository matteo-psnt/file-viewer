name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Keeps a release PR open that bumps the version in plugin.json and adds
      # a CHANGELOG section from the Conventional Commits since the last tag.
      # Merging it tags the release and publishes it on GitHub.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
